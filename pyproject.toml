[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt-rl"
version = "0.1.0"
description = "Renderer-first GRPO pipeline for constrained HTML PPT/document generation"
readme = "RL_PIPELINE_SPEC.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.2", "transformers>=4.40"]
render = ["playwright>=1.44"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
